<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Convert JSON to CSV in the browser: nested objects, arrays and JSON Lines.">
  <title>JSON2CSV</title>
  <style>
    :root, :root[data-theme="light"] {
      --bg:#f0f0f0; --alt:#ffffff; --text:#333333; --muted:#6b6b6b; --border:#d6d6d6;
      --accent:#4bc67c; --accent-hover:#348b57; --accent-text:#ffffff; --danger:#d64545;
      --shadow:0 2px 8px rgba(0,0,0,.08);
    }
    :root[data-theme="dark"] {
      --bg:#1d1d1d; --alt:#2d2d2d; --text:#e0e0e0; --muted:#a0a0a0; --border:#444444;
      --accent:#58319f; --accent-hover:#6d45b8; --accent-text:#ffffff; --danger:#e26a6a;
      --shadow:0 2px 8px rgba(0,0,0,.4);
    }
    :root[data-theme="sepia"] {
      --bg:#f4ecd8; --alt:#fbf0d9; --text:#5b4636; --muted:#8a7360; --border:#dccfae;
      --accent:#c19a6b; --accent-hover:#a67c52; --accent-text:#ffffff; --danger:#b5483a;
      --shadow:0 2px 8px rgba(91,70,54,.12);
    }
    :root[data-theme="terminal"] {
      --bg:#0e290e; --alt:#0c2108; --text:#59b822; --muted:#3f8a18; --border:#1f5a1f;
      --accent:#13451a; --accent-hover:#186d1d; --accent-text:#59b822; --danger:#c20000;
      --shadow:none;
    }
    * { box-sizing:border-box; }
    html { color-scheme: light; }
    :root[data-theme="dark"], :root[data-theme="terminal"] { color-scheme: dark; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.45; }
    :root[data-theme="terminal"] body, :root[data-theme="terminal"] button, :root[data-theme="terminal"] input,
    :root[data-theme="terminal"] select, :root[data-theme="terminal"] textarea { font-family:ui-monospace,Menlo,Consolas,monospace; }
    h1 { margin:0; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-weight:600; }
    button, select, input, textarea { font:inherit; color:inherit; }
    button { background:var(--accent); color:var(--accent-text); border:1px solid transparent; border-radius:6px; padding:.5em .9em; cursor:pointer; transition:background .15s; }
    :root[data-theme="terminal"] button { border-color:var(--border); }
    button:hover:not(:disabled) { background:var(--accent-hover); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button.secondary { background:transparent; color:var(--text); border-color:var(--border); }
    button.secondary:hover:not(:disabled) { background:var(--alt); }
    button.danger { background:transparent; color:var(--danger); border-color:var(--border); }
    button.danger:hover:not(:disabled) { background:var(--danger); color:#fff; }
    input[type=text], input[type=number], input[type=search], input[type=date], select, textarea {
      background:var(--alt); border:1px solid var(--border); border-radius:6px; padding:.5em .65em; max-width:100%;
    }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    :root[data-theme="dark"] :focus-visible { outline-color:#a98ae6; }
    a { color:inherit; }
    .sapp-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:960px; margin:0 auto; padding:18px 16px 8px; }
    .sapp-bar .right { display:flex; gap:8px; align-items:center; }
    .sapp-wrap { max-width:960px; margin:0 auto; padding:8px 16px 64px; }
    .card { background:var(--alt); border:1px solid var(--border); border-radius:10px; padding:16px; box-shadow:var(--shadow); }
    .muted { color:var(--muted); }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .sapp-toast { position:fixed; left:50%; bottom:46px; transform:translate(-50%,20px); background:var(--text); color:var(--bg); padding:.55em 1em; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:50; max-width:90vw; }
    .sapp-toast.show { opacity:1; transform:translate(-50%,0); }
    footer.sapp-foot { position:fixed; bottom:0; right:0; padding:4px 12px; font-size:.8em; color:var(--muted); opacity:.55; transition:opacity .3s; }
    footer.sapp-foot:hover { opacity:1; }
    dialog { background:var(--alt); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:20px; width:min(520px,92vw); }
    dialog::backdrop { background:rgba(0,0,0,.5); }
    dialog textarea { width:100%; min-height:180px; }
    dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    @media (prefers-reduced-motion: reduce) { * { transition-duration:.01ms !important; animation-duration:.01ms !important; } }


    .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; }
    @media (max-width:820px) { .grid2 { grid-template-columns:1fr; } }
    textarea.io { width:100%; min-height:300px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.85rem; resize:vertical; }
    .opts { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; margin:12px 0; }
    .opts label { display:flex; align-items:center; gap:6px; }
    .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
    #msg { min-height:1.4em; font-size:.9rem; }
    #msg.err { color:var(--danger); }
    .tablewrap { overflow:auto; max-height:320px; border:1px solid var(--border); border-radius:8px; margin-top:12px; }
    table { border-collapse:collapse; width:100%; font-size:.85rem; background:var(--alt); }
    th, td { padding:5px 9px; border-bottom:1px solid var(--border); border-right:1px solid var(--border); text-align:left; white-space:nowrap; max-width:260px; overflow:hidden; text-overflow:ellipsis; }
    th { position:sticky; top:0; background:var(--bg); }
    h2 { font-size:1rem; margin:0 0 6px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
    #drop.over textarea { outline:2px dashed var(--accent); }

  </style>
</head>
<body>
  <header class="sapp-bar">
    <h1>JSON2CSV</h1>
    <div class="right"><label class="sr-only" for="themeSelect">Theme</label><select id="themeSelect" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="sepia">Sepia</option><option value="terminal">Terminal</option></select></div>
  </header>

  <main class="sapp-wrap">
    <div class="grid2">
      <section class="card" id="drop">
        <h2>JSON in</h2>
        <textarea id="input" class="io" spellcheck="false" placeholder='Paste JSON here, or drop a .json file.&#10;&#10;[{"name":"Ada","tags":["a","b"],"address":{"city":"London"}}]' aria-label="JSON input"></textarea>
        <div class="row">
          <button type="button" class="secondary" id="loadBtn">Load file…</button>
          <button type="button" class="secondary" id="sampleBtn">Try a sample</button>
          <button type="button" class="secondary" id="clearBtn">Clear</button>
          <input type="file" id="file" accept=".json,.jsonl,.ndjson,application/json,text/plain" hidden>
        </div>
        <div class="row" id="rootRow" hidden><label for="rootSel">Use array at</label><select id="rootSel"></select></div>
      </section>
      <section class="card">
        <h2>CSV out</h2>
        <textarea id="output" class="io" spellcheck="false" readonly aria-label="CSV output"></textarea>
        <div class="row">
          <button type="button" id="dlBtn" disabled>Download .csv</button>
          <button type="button" class="secondary" id="copyBtn" disabled>Copy</button>
        </div>
        <div id="msg" role="status"></div>
      </section>
    </div>
    <section class="card" style="margin-top:16px">
      <h2>Options</h2>
      <div class="opts">
        <label>Delimiter <select id="delim"><option value=",">Comma</option><option value=";">Semicolon</option><option value="&#9;">Tab</option><option value="|">Pipe</option></select></label>
        <label>Arrays <select id="arrays"><option value="join">Join with “; ”</option><option value="json">Keep as JSON</option><option value="expand">Split into columns</option></select></label>
        <label><input type="checkbox" id="flatten"> Flatten nested objects (a.b)</label>
        <label><input type="checkbox" id="header"> Header row</label>
        <label><input type="checkbox" id="quoteAll"> Quote every cell</label>
        <label><input type="checkbox" id="bom"> Excel-friendly (UTF-8 BOM)</label>
        <label><input type="checkbox" id="guard"> Defuse spreadsheet formulas</label>
      </div>
      <h2 style="margin-top:14px">Preview</h2>
      <div class="tablewrap"><table id="preview"></table></div>
    </section>
  </main>

  <div id="toast" class="sapp-toast" role="status" aria-live="polite"></div>
  <footer class="sapp-foot"><span id="versionNumber"></span></footer>
  <script>
    "use strict";
    const APP_NAME = "JSON2CSV";
    const APP_VERSION = "1.0.0";
    const APP_KEY = "sapps.json2csv.";

    // ---- shared SApp plumbing -------------------------------------------------
    const store = {
      get(key, fallback) { try { const v = localStorage.getItem(APP_KEY + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
      set(key, value) { try { localStorage.setItem(APP_KEY + key, JSON.stringify(value)); return true; } catch (e) { return false; } },
      remove(key) { try { localStorage.removeItem(APP_KEY + key); } catch (e) { /* ignore */ } }
    };
    function esc(text) { return String(text).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
    function toast(message) {
      const el = document.getElementById('toast'); if (!el) return;
      el.textContent = message; el.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400);
    }
    function download(filename, text, type) {
      const url = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function copyText(text) {
      const fallback = () => { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* ignore */ } t.remove(); return ok; };
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
      return Promise.resolve(fallback());
    }
    function initTheme() {
      const sel = document.getElementById('themeSelect');
      const saved = store.get('theme', null);
      const theme = saved || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme; sel.value = theme;
      sel.addEventListener('change', () => { document.documentElement.dataset.theme = sel.value; store.set('theme', sel.value); });
    }
    document.getElementById('versionNumber').textContent = APP_NAME + ' v' + APP_VERSION;
    document.title = APP_NAME;
    initTheme();


    const $ = id => document.getElementById(id);
    const DEFAULTS = { delim: ',', arrays: 'join', flatten: true, header: true, quoteAll: false, bom: false, guard: true };
    let opts = Object.assign({}, DEFAULTS, store.get('options', {}));
    let lastCsv = '', rootPath = '';

    // ---- parsing ---------------------------------------------------------------
    function parseInput(text) {
      const t = text.trim(); if (!t) return { empty: true };
      try { return { value: JSON.parse(t) }; }
      catch (e) {
        const lines = t.split(/\r?\n/).filter(l => l.trim());                  // maybe JSON Lines
        if (lines.length > 1) { try { return { value: lines.map(l => JSON.parse(l)), note: 'Read as JSON Lines.' }; } catch (e2) { /* fall through */ } }
        const m = String(e.message).match(/position (\d+)/);
        let where = ''; if (m && !/line \d+/.test(e.message)) { const before = t.slice(0, +m[1]); where = ' (line ' + (before.split('\n').length) + ', column ' + (before.length - before.lastIndexOf('\n')) + ')'; }
        return { error: e.message.replace(/^JSON\.parse: /, '') + where };
      }
    }
    // Find arrays of objects inside a wrapper object such as {"data":[...]}
    function candidates(v, path = '', out = [], depth = 0) {
      if (depth > 3 || v === null || typeof v !== 'object') return out;
      if (Array.isArray(v)) { if (v.length && v.every(x => x && typeof x === 'object')) out.push({ path, size: v.length }); return out; }
      Object.keys(v).forEach(k => candidates(v[k], path ? path + '.' + k : k, out, depth + 1)); return out;
    }
    function at(v, path) { return path ? path.split('.').reduce((a, k) => a[k], v) : v; }

    function toRows(v) {
      if (Array.isArray(v)) return v.map(x => (x !== null && typeof x === 'object' && !Array.isArray(x)) ? x : { value: x });
      if (v !== null && typeof v === 'object') {
        const vals = Object.values(v);
        if (vals.length && vals.every(x => x && typeof x === 'object' && !Array.isArray(x))) return Object.entries(v).map(([k, x]) => Object.assign({ _key: k }, x));   // {id: {...}, id2: {...}}
        return [v];
      }
      return [{ value: v }];
    }
    function flat(obj, prefix, out) {
      Object.keys(obj).forEach(k => {
        const key = prefix ? prefix + '.' + k : k, v = obj[k];
        if (Array.isArray(v)) {
          if (opts.arrays === 'expand') v.forEach((x, i) => (x !== null && typeof x === 'object' && opts.flatten) ? flat(x, key + '[' + i + ']', out) : (out[key + '[' + i + ']'] = x));
          else if (opts.arrays === 'json') out[key] = JSON.stringify(v);
          else out[key] = v.map(x => (x !== null && typeof x === 'object') ? JSON.stringify(x) : String(x)).join('; ');
        } else if (v !== null && typeof v === 'object') {
          if (opts.flatten) flat(v, key, out); else out[key] = JSON.stringify(v);
        } else out[key] = v;
      });
      return out;
    }
    function cell(v) {
      if (v === null || v === undefined) return '';
      let s = typeof v === 'string' ? v : String(v);
      if (opts.guard && typeof v === 'string' && /^[=+\-@\t\r]/.test(s) && isNaN(Number(s))) s = "'" + s;
      const d = opts.delim;
      return (opts.quoteAll || s.includes(d) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function convert(rows) {
      const flatRows = rows.map(r => flat(r, '', {}));
      const cols = []; const seen = new Set();
      flatRows.forEach(r => Object.keys(r).forEach(k => { if (!seen.has(k)) { seen.add(k); cols.push(k); } }));
      const lines = flatRows.map(r => cols.map(c => cell(r[c])).join(opts.delim));
      if (opts.header) lines.unshift(cols.map(c => cell(c)).join(opts.delim));
      return { csv: lines.join('\r\n'), cols, rows: flatRows };
    }

    // ---- UI --------------------------------------------------------------------
    function msg(text, bad) { $('msg').textContent = text; $('msg').className = bad ? 'err' : ''; }
    function run() {
      const res = parseInput($('input').value);
      lastCsv = ''; $('output').value = ''; $('preview').innerHTML = ''; $('dlBtn').disabled = $('copyBtn').disabled = true; $('rootRow').hidden = true;
      if (res.empty) return msg('Paste some JSON to begin.');
      if (res.error) return msg('Invalid JSON: ' + res.error, true);
      let v = res.value;
      const cand = (v && typeof v === 'object' && !Array.isArray(v)) ? candidates(v) : [];
      if (cand.length && !(Array.isArray(v)) && !(Object.values(v).every(x => x && typeof x === 'object' && !Array.isArray(x)) && !cand.length)) {
        if (cand.length > 1 || cand[0].path) {
          $('rootRow').hidden = false;
          $('rootSel').innerHTML = cand.map(c => '<option value="' + esc(c.path) + '">' + esc(c.path || '(top level)') + ' — ' + c.size + ' rows</option>').join('');
          if (!cand.some(c => c.path === rootPath)) rootPath = cand[0].path;
          $('rootSel').value = rootPath; v = at(v, rootPath);
        }
      }
      const rows = toRows(v);
      if (!rows.length) return msg('Nothing to convert: the array is empty.', true);
      const out = convert(rows); lastCsv = out.csv; $('output').value = out.csv;
      $('dlBtn').disabled = $('copyBtn').disabled = false;
      msg(rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' × ' + out.cols.length + ' column' + (out.cols.length === 1 ? '' : 's') + '.' + (res.note ? ' ' + res.note : ''));
      const shown = out.rows.slice(0, 50);
      $('preview').innerHTML = '<thead><tr>' + out.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' +
        shown.map(r => '<tr>' + out.cols.map(c => '<td title="' + esc(r[c] === undefined || r[c] === null ? '' : r[c]) + '">' + esc(r[c] === undefined || r[c] === null ? '' : r[c]) + '</td>').join('') + '</tr>').join('') + '</tbody>' +
        (out.rows.length > 50 ? '<tfoot><tr><td colspan="' + out.cols.length + '" class="muted">Showing the first 50 of ' + out.rows.length + ' rows.</td></tr></tfoot>' : '');
    }
    function syncOpts() { $('delim').value = opts.delim; $('arrays').value = opts.arrays; ['flatten', 'header', 'quoteAll', 'bom', 'guard'].forEach(k => $(k).checked = !!opts[k]); }
    ['delim', 'arrays'].forEach(k => $(k).addEventListener('change', () => { opts[k] = $(k).value; store.set('options', opts); run(); }));
    ['flatten', 'header', 'quoteAll', 'bom', 'guard'].forEach(k => $(k).addEventListener('change', () => { opts[k] = $(k).checked; store.set('options', opts); run(); }));
    $('rootSel').addEventListener('change', () => { rootPath = $('rootSel').value; run(); });
    $('input').addEventListener('input', run);
    $('clearBtn').addEventListener('click', () => { $('input').value = ''; run(); $('input').focus(); });
    $('sampleBtn').addEventListener('click', () => { $('input').value = JSON.stringify({ meta: { source: 'sample' }, people: [
      { name: 'Ada Lovelace', born: 1815, tags: ['maths', 'poetry'], address: { city: 'London', country: 'UK' } },
      { name: 'Grace "Amazing" Hopper', born: 1906, tags: ['navy'], address: { city: 'New York' }, notes: 'Said, "it\'s easier to ask forgiveness"' }
    ] }, null, 2); run(); });
    $('loadBtn').addEventListener('click', () => $('file').click());
    function readFile(f) { if (f) f.text().then(t => { $('input').value = t; run(); }); }
    $('file').addEventListener('change', e => { readFile(e.target.files[0]); e.target.value = ''; });
    const drop = $('drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => readFile(e.dataTransfer.files[0]));
    $('dlBtn').addEventListener('click', () => download('converted.csv', (opts.bom ? '﻿' : '') + lastCsv + '\r\n', 'text/csv;charset=utf-8'));
    $('copyBtn').addEventListener('click', () => copyText(lastCsv).then(ok => toast(ok ? 'CSV copied.' : 'Copy failed.')));
    syncOpts(); run();
    window.__j2c = { parseInput, toRows, convert, setOpts: o => { Object.assign(opts, o); } };

  </script>
</body>
</html>
